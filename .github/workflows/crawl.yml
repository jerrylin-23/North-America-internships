name: Auto-Crawl 2027 Internships

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Meta fingerprints plain HTTP clients, so its provider drives Chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Tesla's edge rejects any client whose TLS fingerprint isn't a real
      # browser; providers/tesla_jobs.py uses curl_cffi to match Chrome's.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Matches the interpreter path companies.json invokes for Tesla.
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run crawler
        run: node crawl.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes in README.md or jobs-history.json
          if [ -n "$(git status --porcelain)" ]; then
            git add README.md jobs-history.json
            git commit -m "Auto-update internships [skip ci]"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
