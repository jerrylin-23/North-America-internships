name: Auto-Crawl 2027 Internships

on:
  schedule:
    - cron: '17 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: internship-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Meta fingerprints plain HTTP clients, so its provider drives Chromium.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run crawler
        run: node crawl.js

      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan-report.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes in README.md or jobs-history.json
          git add README.md jobs-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update internships [skip ci]"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
